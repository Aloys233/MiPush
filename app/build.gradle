plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace 'com.aloys23.mipush'
    compileSdk COMPILE_SDK

    defaultConfig {
        applicationId APPLICATION_ID
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode gitVersionCode
        versionName gitVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    base {
        archivesName = "${rootProject.name}-v${gitVersionName}-${gitVersionCode}"
    }

    signingConfigs {
        // 与 MiPushFramework 一致:debug 与 release 都用这个 signingConfig。
        // 没配置正式密钥(local.properties 里没有 STORE_FILE_PATH)时,保留 AGP 默认的 debug keystore,
        // 这样 release 也能装;CI 里若写入了 STORE_FILE_PATH 等,则改用正式密钥签名。
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            def locale, keystorePwd, alias, pwd
            if (project.rootProject.file('local.properties').exists()) {
                Properties properties = new Properties()
                properties.load(project.rootProject.file('local.properties').newDataInputStream())
                locale = properties.getProperty("STORE_FILE_PATH")
                alias = properties.getProperty("KEY_ALIAS")
                pwd = properties.getProperty("KEY_PASSWORD")
                keystorePwd = properties.getProperty("STORE_PASSWORD")
            }
            if (locale != null && file(locale).exists()) {
                storeFile file(locale)
                storePassword keystorePwd
                keyAlias alias
                keyPassword pwd
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
    }
    // libxposed 模块元数据放在 META-INF/xposed/*，AGP 默认资源合并规则会丢弃它，需显式 merges。
    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }
}

dependencies {
    api project(":common")
    api project(":xposed")

    //remove this line will cause proguard to remove code from library module
    compileOnly 'io.github.libxposed:api:102.0.0'
}
